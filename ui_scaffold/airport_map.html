<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport map</title>
<style>
/* Local page. Reconstructed FAA airport diagram, georeferenced. Display only: no predictions, no tracks. */
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d2129;--line:#2a3140;--ink:#eef1f5;--dim:#a3adbd;--faint:#6b7585;--gmaps:#2dd4bf;--human:#e2b43a;--caution:#f5a524;--osm:#c2187a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--human);flex-wrap:wrap;background:var(--panel)}
header h1{font-size:16px;margin:0;letter-spacing:.08em;color:var(--gmaps)}
.badge{font:600 11px/1 var(--mono);padding:4px 10px;border-radius:999px;border:1px solid rgba(245,165,36,.45);color:var(--caution);background:rgba(245,165,36,.08)}
.badge.draft{font-weight:700;line-height:1.35;border-radius:10px;border-color:var(--caution);background:rgba(245,165,36,.18);max-width:760px}   /* draft map: display only, not reviewed */
.badge[hidden]{display:none}
.toggles{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:13px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.mapwrap{position:relative;flex:1;min-height:320px;background:#ffffff;overflow:hidden;touch-action:none}
#host{position:absolute;inset:0}
#host svg{width:100%;height:100%;display:block;cursor:grab}
#host svg.drag{cursor:grabbing}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:34px;height:34px;border-radius:6px;border:1px solid #c9ced6;background:#fff;color:#111;font:600 16px system-ui;cursor:pointer}
.scale{position:absolute;left:12px;bottom:12px;background:#fff;border:1px solid #c9ced6;box-shadow:0 1px 3px rgba(0,0,0,.25);padding:4px 8px;border-radius:4px;font:11px var(--mono);color:#111}
.scale .bar{height:6px;border:2px solid #111;border-top:0;margin-top:2px}
.north{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid #c9ced6;box-shadow:0 1px 3px rgba(0,0,0,.25);padding:4px 8px;border-radius:4px;font:600 12px var(--mono);color:#111;text-align:center}
.cursor{float:right;margin-left:16px;font:11px var(--mono);color:var(--dim)}   /* in the footer, outside the map: never covers chart text */
footer{padding:8px 16px;border-top:1px solid var(--line);font:12px var(--mono);color:var(--dim);background:var(--panel)}
footer .osm{color:#ff8fc8;margin-top:4px}
.expired{background:#3a1212;border-bottom:2px solid #ff5a52;color:#ffd7d4;font-weight:700;padding:9px 16px;font-size:13px}
.signoff{font:12px var(--mono);color:var(--gmaps);padding:4px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.signoff.recheck{color:#ffb4ae}
.empty{color:#444;padding:20px;font-style:italic}
</style>
</head>
<body>
<div class="expired" id="expired" role="alert" hidden>CHART CYCLE EXPIRED — re-run A6 (tools/airport_map/cycle_check.py) and rebuild from the current FAA cycle.</div>
<header>
  <h1>GMAPS · <span id="icao">airport</span> map</h1>
  <span class="badge">Display only · not for navigation · no predictions</span>
  <span class="badge draft" id="draftBadge" hidden></span>
  <div class="toggles" id="toggles"></div>
</header>
<div class="signoff" id="signoff" hidden></div>
<div class="mapwrap">
  <div id="host"><div class="empty">Loading map…</div></div>
  <div class="ctl"><button id="zin" title="zoom in">+</button><button id="zout" title="zoom out">−</button><button id="zreset" title="whole chart">⤢</button></div>
  <div class="scale"><span id="scaleTxt"></span><div class="bar" id="scaleBar"></div></div>
  <div class="north">N ↑<br><span style="font-weight:400">true north</span></div>
</div>
<footer>
  <div class="cursor" id="cursor">move the cursor over the map</div>
  <div id="prov">Loading provenance…</div>
  <div class="osm" id="osmAttr" hidden></div>
</footer>
<script src="cycle.js"></script>
<script>
// Chart layers come from data/airports/<icao>/map (built by tools/airport_map/build_map.py). This page computes nothing about traffic.
const q = new URLSearchParams(location.search);
const ICAO = (q.get('icao') || 'klga').toLowerCase().replace(/[^a-z0-9]/g, '');
const BASE = `maps/${ICAO}/`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let META = null, SVG = null, VB = null, HOME = null, osmLoaded = false;
const DRAFT = () => !!META && (META.status === 'draft' || META.overlays_allowed === false);   // a draft map takes no ledger overlay and no crossing points
const OSM_LABEL_MAX_MPP = 1.2;   // metres per screen pixel; the full KLGA view is ~2.3

async function init(){
  try {
    META = await (await fetch(BASE + 'map_meta.json')).json();
    const txt = await (await fetch(BASE + 'chart.svg')).text();
    $('host').innerHTML = txt; SVG = $('host').querySelector('svg');
  } catch (e) { $('host').innerHTML = `<div class="empty">Could not load ${esc(BASE)}: build it with python3 tools/airport_map/build_map.py --icao ${esc(ICAO)}</div>`; return; }
  $('icao').textContent = META.icao;
  if (DRAFT()){ $('draftBadge').hidden = false; $('draftBadge').textContent = `DRAFT · display only · not reviewed · ${META.draft_reason || ''}`; }
  $('prov').textContent = META.footer;                          // stored cycle / provenance line (provenance.json display.footer)
  showCycle();
  HOME = SVG.getAttribute('viewBox').split(/\s+/).map(Number);
  const v = (q.get('view') || '').split(',').map(Number);
  VB = v.length === 4 && v.every(isFinite) ? v : HOME.slice();
  META.layers.forEach(l => {
    const lab = document.createElement('label');
    const on = l.id === 'layer-osm' ? q.get('osm') === '1' : l.default;    // OSM is off unless asked for
    lab.innerHTML = `<input type="checkbox" data-layer="${esc(l.id)}" ${on ? 'checked' : ''}> ${esc(l.label)}${l.requires_attribution ? ' <span style="color:var(--dim)">(ODbL)</span>' : ''}`;
    $('toggles').appendChild(lab);
  });
  $('toggles').addEventListener('change', e => setLayer(e.target.dataset.layer, e.target.checked));
  for (const cb of $('toggles').querySelectorAll('input')) await setLayer(cb.dataset.layer, cb.checked);
  apply(); wire();
}

function showCycle(){   // offline cycle check on load (cycle.js); ?today= is for testing only and is shown when used
  const fake = q.get('today'), now = fake ? new Date(fake) : new Date();
  const st = chartCycleStatus(META.chart.effective_from, META.chart.effective_to, now);
  $('expired').hidden = !st.expired;
  const so = META.sign_off, el = $('signoff'), tag = fake ? ` [testing: today=${fake}]` : '';
  if (so){
    el.hidden = false; el.classList.toggle('recheck', !st.current);
    el.textContent = st.current
      ? `Signed off for ${so.scope.replace('_', ' ')} by ${so.by} on ${so.date} (commit ${so.applies_to_commit.slice(0, 7)}); predictions ${so.predictions_enabled ? 'ENABLED' : 'off'}. Cycle ${META.chart.cycle} current, ${st.daysLeft.toFixed(1)} days left.${tag}`
      : `Sign-off by ${so.by} on ${so.date} (${so.scope.replace('_', ' ')}) NEEDS RE-CHECK: chart cycle ${META.chart.cycle} ${st.expired ? 'expired ' + st.to.slice(0, 16) + 'Z' : 'not yet effective'}.${tag}`;
  } else if (fake || !st.current){ el.hidden = false; el.classList.add('recheck'); el.textContent = `Not signed off. Cycle ${META.chart.cycle} ${st.current ? 'current' : 'NOT current'}.${tag}`; }
}

async function setLayer(id, on){
  const L = META.layers.find(l => l.id === id); if (!L) return;
  if (L.css_class){ SVG.classList.toggle('hide-' + L.css_class.slice(2), !on); return; }   // chart / labels share one paint-ordered group
  const g = SVG.querySelector('#' + id); if (!g) return;
  if (id === 'layer-osm'){
    if (on && !osmLoaded) await loadOsm(g);
    $('osmAttr').hidden = !on;                                   // attribution visible whenever OSM is shown
    $('osmAttr').textContent = on ? `OSM taxiways: ${META.osm_attribution} · OSM data ${META.osm_data_timestamp} · kept separate from the FAA-derived layers` : '';
  }
  g.style.display = on ? '' : 'none';
}

function en(lat, lon){   // lat/lon -> SVG metres (x = east, y = south), same local frame as the chart
  const f = META.frame, r = Math.PI / 180;
  return [(lon - f.lon0) * r * f.N * Math.cos(f.lat0 * r), -(lat - f.lat0) * r * f.M];
}
function ll(x, y){
  const f = META.frame, r = Math.PI / 180;
  return [f.lat0 + (-y / f.M) / r, f.lon0 + (x / (f.N * Math.cos(f.lat0 * r))) / r];
}

async function loadOsm(g){
  const fc = await (await fetch(BASE + 'osm/osm_taxiways.geojson')).json();
  const ns = 'http://www.w3.org/2000/svg';
  for (const f of fc.features){
    const pts = f.geometry.coordinates.map(([lon, lat]) => en(lat, lon));
    const pl = document.createElementNS(ns, 'polyline');
    pl.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    pl.setAttribute('fill', 'none'); pl.setAttribute('stroke', '#c2187a'); pl.setAttribute('stroke-width', '2.2');
    pl.setAttribute('vector-effect', 'non-scaling-stroke'); pl.setAttribute('stroke-opacity', '.85');
    const t = document.createElementNS(ns, 'title'); t.textContent = `OSM ${f.properties.aeroway} ${f.properties.ref ?? '(no ref)'} · way ${f.properties.osm_id}`;
    pl.appendChild(t); g.appendChild(pl);
  }
  // one label per connected taxiway: OSM splits a taxiway into many ways, so ways with the same ref that share an
  // endpoint are joined, and the joined taxiway is labelled once, at the midpoint of its longest way
  const key = p => p.map(v => v.toFixed(1)).join(',');
  const byRef = {};
  fc.features.forEach(f => { if (f.properties.ref) (byRef[f.properties.ref] ??= []).push(f.geometry.coordinates.map(([lon, lat]) => en(lat, lon))); });
  for (const [ref, ways] of Object.entries(byRef)){
    const parent = ways.map((_, i) => i), find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    const ends = {};
    ways.forEach((w, i) => [w[0], w[w.length - 1]].forEach(p => { const k = key(p); if (k in ends) parent[find(i)] = find(ends[k]); else ends[k] = i; }));
    const len = w => w.slice(1).reduce((s, p, j) => s + Math.hypot(p[0] - w[j][0], p[1] - w[j][1]), 0);
    const groups = {};
    ways.forEach((w, i) => (groups[find(i)] ??= []).push(w));
    for (const grp of Object.values(groups)){
      const w = grp.reduce((a, b) => len(b) > len(a) ? b : a), half = len(w) / 2;
      let acc = 0, m = w[0];
      for (let j = 1; j < w.length; j++){ const d = Math.hypot(w[j][0] - w[j - 1][0], w[j][1] - w[j - 1][1]);
        if (acc + d >= half){ const t = (half - acc) / d; m = [w[j - 1][0] + t * (w[j][0] - w[j - 1][0]), w[j - 1][1] + t * (w[j][1] - w[j - 1][1])]; break; } acc += d; }
      const tx = document.createElementNS(ns, 'text');
      tx.setAttribute('x', m[0]); tx.setAttribute('y', m[1]); tx.setAttribute('class', 'osmref'); tx.setAttribute('fill', '#c2187a');
      tx.setAttribute('font-family', 'ui-monospace,monospace'); tx.setAttribute('font-weight', '700'); tx.setAttribute('text-anchor', 'middle');
      tx.setAttribute('paint-order', 'stroke'); tx.setAttribute('stroke', '#ffffff'); tx.setAttribute('stroke-width', '0'); tx.textContent = ref; g.appendChild(tx);
    }
  }
  osmLoaded = true; apply();
}

function apply(){
  SVG.setAttribute('viewBox', VB.join(' '));
  const r = SVG.getBoundingClientRect(), mpp = Math.max(VB[2] / r.width, VB[3] / r.height);   // metres per screen pixel (meet)
  const showRefs = mpp <= OSM_LABEL_MAX_MPP;   // OSM refs only when zoomed in, so they don't stack on the chart's own labels
  SVG.querySelectorAll('text.osmref').forEach(t => { t.style.display = showRefs ? '' : 'none';
    t.setAttribute('font-size', (11 * mpp).toFixed(2)); t.setAttribute('stroke-width', (3 * mpp).toFixed(2)); });
  SVG.querySelectorAll('#gmaps-ledger text').forEach((t, i) => { const big = t.getAttribute('font-weight') === '700'; t.setAttribute('font-size', ((big ? 17 : 12) * mpp).toFixed(1)); t.setAttribute('stroke-width', ((big ? 4 : 3) * mpp).toFixed(1)); });
  const target = 120 * mpp, p10 = Math.pow(10, Math.floor(Math.log10(target)));
  const nice = [1, 2, 5, 10].map(k => k * p10).filter(v => v <= target).pop() || p10;
  $('scaleBar').style.width = (nice / mpp).toFixed(0) + 'px';
  $('scaleTxt').textContent = nice >= 1000 ? (nice / 1000) + ' km' : nice + ' m';
}

function toSvg(ev){ const p = SVG.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(SVG.getScreenCTM().inverse()); }
function zoom(k, cx, cy){
  cx ??= VB[0] + VB[2] / 2; cy ??= VB[1] + VB[3] / 2;
  VB = [cx - (cx - VB[0]) * k, cy - (cy - VB[1]) * k, VB[2] * k, VB[3] * k]; apply();
}
function wire(){
  SVG.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e); zoom(e.deltaY > 0 ? 1.2 : 1 / 1.2, p.x, p.y); }, {passive: false});
  let drag = null;
  SVG.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, vb: VB.slice()}; SVG.classList.add('drag'); SVG.setPointerCapture(e.pointerId); });
  SVG.addEventListener('pointermove', e => {
    const p = toSvg(e), [lat, lon] = ll(p.x, p.y);
    $('cursor').textContent = `${lat.toFixed(5)}°, ${lon.toFixed(5)}° (WGS84, from the chart: display only)`;
    if (!drag) return;
    const r = SVG.getBoundingClientRect(), mpp = Math.max(VB[2] / r.width, VB[3] / r.height);
    VB = [drag.vb[0] - (e.clientX - drag.x) * mpp, drag.vb[1] - (e.clientY - drag.y) * mpp, VB[2], VB[3]]; apply();
  });
  SVG.addEventListener('pointerup', () => { drag = null; SVG.classList.remove('drag'); });
  $('zin').onclick = () => zoom(1 / 1.5); $('zout').onclick = () => zoom(1.5); $('zreset').onclick = () => { VB = HOME.slice(); apply(); };
  window.addEventListener('resize', apply);
}
// ---- ledger overlay (display only). The demo page (same origin) posts which runways currently hold open, recorded authorizations;
// this page tints those runways on the reconstructed diagram and can glide the view onto one of them. Nothing here is a position,
// a track or a prediction: the flowing dashes show the direction a runway is reserved for (its landing/takeoff end), not movement.
let RWENDS = null, ANIM = null, GLIDE = 0, POINTS = [], CHAIN = Promise.resolve();
window.addEventListener('message', e => { CHAIN = CHAIN.then(() => onMessage(e)).catch(() => {}); });   // in order: a view follows its ledger
async function onMessage(e){
  if (e.origin !== location.origin || !e.data || !SVG) return;
  if (!RWENDS){ try { RWENDS = (await (await fetch('runway_ends.json', {cache: 'no-store'})).json()).airports[ICAO] || {runways: []}; } catch (err) { RWENDS = {runways: [], error: String(err)}; } }
  if (e.data.type === 'gmaps-ledger' && DRAFT()){   // refused: nothing is drawn on a draft map
    try { e.source.postMessage({type: 'gmaps-ledger-ack', drawn: [], points: [], refused: 'draft map', known: [], error: null, page: PAGE_BUILD}, e.origin); } catch (_) {}
  } else if (e.data.type === 'gmaps-ledger'){
    POINTS = await placePoints(e.data.points || []);
    const drawn = drawLedger(e.data.runways || {}, POINTS, e.data.ends || []);
    try { e.source.postMessage({type: 'gmaps-ledger-ack', drawn, points: POINTS.map(p => `${p.taxiway}@${p.rw.id}:${p.phase}`), known: RWENDS.runways.map(r => r.id), error: RWENDS.error || null, page: PAGE_BUILD}, e.origin); } catch (_) {}
  } else if (e.data.type === 'gmaps-view'){
    focusRunway(e.data.focus, e.data.pad || 420);
    try { e.source.postMessage({type: 'gmaps-view-ack', focus: e.data.focus || null, page: PAGE_BUILD}, e.origin); } catch (_) {}
  }
}
// The place a crossing clearance names: where the named taxiway's OSM centreline (same ref) meets the runway centreline between the
// NASR ends. Computed here, once per airport/taxiway/runway. It is a place on the chart, never a vehicle position.
let OSMFC = null; const XCACHE = {};
async function crossingPoint(taxiway, rw){
  const k = `${ICAO}|${taxiway}|${rw.id}`; if (k in XCACHE) return XCACHE[k];
  if (!OSMFC){ try { OSMFC = await (await fetch(BASE + 'osm/osm_taxiways.geojson')).json(); } catch (err) { OSMFC = {features: []}; } }
  const [a, b] = rw.ends, L = Math.hypot(b.x - a.x, b.y - a.y), hits = [];
  OSMFC.features.filter(f => f.properties.ref === taxiway && f.geometry.type === 'LineString').forEach(f => {
    const pts = f.geometry.coordinates.map(([lon, lat]) => en(lat, lon));
    for (let i = 0; i + 1 < pts.length; i++){ const [c, d] = [pts[i], pts[i + 1]], rx = b.x - a.x, ry = b.y - a.y, sx = d[0] - c[0], sy = d[1] - c[1], den = rx * sy - ry * sx;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((c[0] - a.x) * sy - (c[1] - a.y) * sx) / den, u = ((c[0] - a.x) * ry - (c[1] - a.y) * rx) / den;
      if (t >= 0 && t <= 1 && u >= 0 && u <= 1) hits.push({x: a.x + t * rx, y: a.y + t * ry, from_end: a.id, dist_m: t * L}); }
  });
  return (XCACHE[k] = hits.length ? hits[0] : null);
}
async function placePoints(list){
  const out = [];
  for (const p of list){ const rw = findRw(p.runway); if (!rw || !p.taxiway) continue; const x = await crossingPoint(p.taxiway, rw); if (x) out.push({...p, rw, ...x}); }
  return out;
}
const PAGE_BUILD = '2026-10-18v';
const normRw = s => String(s).toUpperCase().replace(/^.*RWY:/, '').replace('/', '-').split('-').map(x => x.replace(/^0+(?=\d)/, '')).join('-');
function findRw(key){ return RWENDS.runways.find(rw => normRw(key) === normRw(rw.id) || rw.id.split('-').map(x => x.replace(/^0+(?=\d)/, '')).includes(normRw(key))); }
const PHASE = {requested: ['#9fb0c9', 'asks to cross here'], cleared: ['#f59e0b', 'cleared to cross here'], crossing: ['#ef4444', 'crossing (read back)'],
               stop_issued: ['#f59e0b', 'STOP issued'], stop_unacknowledged: ['#ef4444', 'STOP not read back'], stop_acknowledged: ['#64748b', 'stopped']};
function drawLedger(states, points, ends){
  const ns = 'http://www.w3.org/2000/svg', mk = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const old = SVG.querySelector('#gmaps-ledger'); if (old) old.remove();
  const g = mk('g', {id: 'gmaps-ledger', 'pointer-events': 'none'}), drawn = [];
  for (const key of Object.keys(states)){
    const st = states[key], rw = findRw(key); if (!st || !rw) continue; drawn.push(rw.id + ':' + st.state);
    const [a, b] = rw.ends, L = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    const col = st.state === 'conflict' ? '#ff3b30' : st.state === 'caution' ? '#f2b134' : '#2f80ed';
    const r = mk('rect', {x: a.x, y: a.y - 42, width: L, height: 84, rx: 14, transform: `rotate(${ang} ${a.x} ${a.y})`, fill: col, 'fill-opacity': st.state === 'conflict' ? '.4' : '.24', stroke: col, 'stroke-width': '5', 'vector-effect': 'non-scaling-stroke'});
    if (st.state === 'conflict'){ const an = mk('animate', {attributeName: 'fill-opacity', values: '.22;.55;.22', dur: '1.1s', repeatCount: 'indefinite'}); r.appendChild(an); }
    g.appendChild(r);
    // direction of use for landing / takeoff authorizations: dashes flow from the named end toward the far end (intent, not motion)
    (st.uses || []).forEach((u, i) => {
      const from = rw.ends.find(e => e.id.replace(/^0+(?=\d)/, '') === String(u.end || '').replace(/^0+(?=\d)/, '')); if (!from) return;
      const to = rw.ends.find(e => e !== from), off = (i - ((st.uses.length - 1) / 2)) * 16, nx = -(to.y - from.y) / L, ny = (to.x - from.x) / L;
      const ln = mk('line', {x1: from.x + nx * off, y1: from.y + ny * off, x2: to.x + nx * off, y2: to.y + ny * off, stroke: u.type === 'CROSSING' ? '#ffd27a' : '#ffffff', 'stroke-width': u.type === 'CROSSING' ? '10' : '14', 'stroke-linecap': 'round', 'stroke-dasharray': '40 50', 'stroke-opacity': '.9'});
      ln.appendChild(mk('animate', {attributeName: 'stroke-dashoffset', from: '90', to: '0', dur: u.type === 'CROSSING' ? '0.9s' : '1.6s', repeatCount: 'indefinite'}));
      g.appendChild(ln);
    });
    const f = (points || []).some(p => p.rw === rw) ? 0.14 : 0.28;   // keep the runway label clear of a crossing point's label
    const mx = a.x + (b.x - a.x) * f, my = a.y + (b.y - a.y) * f;
    const t = mk('text', {x: mx, y: my - 70, 'text-anchor': 'middle', 'font-size': '40', 'font-weight': '700', fill: col, stroke: '#ffffff', 'stroke-width': '12', 'paint-order': 'stroke', 'font-family': 'system-ui,sans-serif'});
    t.textContent = st.text || ('runway ' + rw.id); g.appendChild(t);
    if (st.sub){ const t2 = mk('text', {x: mx, y: my - 18, 'text-anchor': 'middle', 'font-size': '40', 'font-weight': '600', fill: '#111', stroke: '#ffffff', 'stroke-width': '10', 'paint-order': 'stroke', 'font-family': 'system-ui,sans-serif'}); t2.textContent = st.sub; g.appendChild(t2); }
  }

    const [col, words] = PHASE[p.phase] || PHASE.requested, ring = mk('circle', {cx: p.x, cy: p.y, r: 55, fill: 'none', stroke: col, 'stroke-width': '8', 'vector-effect': 'non-scaling-stroke'});

    if (p.phase === 'stop_issued') ring.appendChild(mk('animate', {attributeName: 'stroke-opacity', values: '1;.2;1', dur: '0.5s', repeatCount: 'indefinite'}));
    if (p.phase === 'stop_unacknowledged') ring.appendChild(mk('animate', {attributeName: 'stroke', values: '#ef4444;#f59e0b;#ef4444', dur: '0.8s', repeatCount: 'indefinite'}));
    g.appendChild(ring);

      g.appendChild(mk('line', {x1, y1, x2, y2, stroke: col, 'stroke-width': '4', 'vector-effect': 'non-scaling-stroke'})));

    t1.textContent = `${p.who || p.callsign} · ${words}`; g.appendChild(t1);
    const t2 = mk('text', {x: p.x, y: p.y + 125, 'text-anchor': 'middle', 'font-size': '40', 'font-weight': '600', fill: '#111', stroke: '#ffffff', 'stroke-width': '10', 'paint-order': 'stroke', 'font-family': 'system-ui,sans-serif'});
    t2.textContent = `taxiway ${p.taxiway} × runway ${p.rwname || p.rw.id} · the place the clearance names · vehicle position not known`; g.appendChild(t2);
  });
  // the end a landing / takeoff clearance is given from: a label at that threshold (the dashes already flow from it)
  (ends || []).forEach(u => { const rw = findRw(u.runway); if (!rw) return; const e = rw.ends.find(x => x.id.replace(/^0+(?=\d)/, '') === String(u.end).replace(/^0+(?=\d)/, '')); if (!e) return;
    const t = mk('text', {x: e.x, y: e.y + 70, 'text-anchor': 'middle', 'font-size': '40', 'font-weight': '600', fill: '#1d4ed8', stroke: '#ffffff', 'stroke-width': '10', 'paint-order': 'stroke', 'font-family': 'system-ui,sans-serif'});
    t.textContent = `${u.who || u.callsign} · cleared to ${u.type === 'TAKEOFF' ? 'take off' : 'land'} from this end · position not known`; g.appendChild(t); });
  // the crossing point comes from OSM: its attribution is shown whenever a point is drawn; otherwise the toggle decides again
  const osmCb = $('toggles').querySelector('input[data-layer="layer-osm"]');
  if ((points || []).length){ $('osmAttr').hidden = false; $('osmAttr').textContent = `Crossing point from OSM taxiway centrelines: ${META.osm_attribution} · OSM data ${META.osm_data_timestamp} · kept separate from the FAA-derived layers`; }
  else if (osmCb) setLayer('layer-osm', osmCb.checked);

}
function focusRunway(key, pad){   // glide the view onto one runway (or back home when key is null)

    const r = SVG.getBoundingClientRect(), asp = r.width > 0 && r.height > 0 ? r.width / r.height : HOME[2] / HOME[3], w = 900, h = w / asp; target = [pt.x - w / 2, pt.y - h / 2, w, h];
  } else if (key){ const rw = findRw(key); if (rw){ const [a, b] = rw.ends, cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2, L = Math.hypot(b.x - a.x, b.y - a.y);

    const r = SVG.getBoundingClientRect(), asp = r.width / Math.max(1, r.height);
    let w = Math.min(HOME[2], Math.max(1100, L * 0.7 + pad)), h = w / asp;

    target = [cx - w / 2, cy - h / 2, w, h]; } }

  if (from.every((v, i) => Math.abs(v - target[i]) < 0.5)) return;
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    VB = from.map((v, i) => v + (target[i] - v) * e); apply(); if (k < 1) ANIM = requestAnimationFrame(step); else ANIM = null; };
  ANIM = requestAnimationFrame(step);
  const mine = ++GLIDE; setTimeout(() => { if (mine === GLIDE && ANIM){ cancelAnimationFrame(ANIM); ANIM = null; VB = target.slice(); apply(); } }, dur + 300);   // frames throttled: land on the target anyway
}
init();
