[pytest]
# tests/test_suite.py runs tests/run_all.py section by section (one pytest item per "# ---" section, in order).
# python3 tests/run_all.py stays the full gate (pre-commit hook); pytest is for boxes without the Spark's local state.
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider
markers =
    spark: needs the Spark host itself: GPU, models, running GMAPS/vLLM services, real clips or labels under ~/gmaps_venue, or this clone's installed git hooks. Deselect with -m "not spark" on a CPU-only box.
